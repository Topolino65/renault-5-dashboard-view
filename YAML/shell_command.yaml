    r5_status_refresh: |-
        /bin/bash -lc '
        set -euo pipefail

        export HOME="/config/renault"
        export XDG_CONFIG_HOME="/config/renault"
        export XDG_DATA_HOME="/config/renault"

        if [ -f "/config/renault/.venv/bin/activate" ]; then
            . "/config/renault/.venv/bin/activate"
        fi

        REN_CLI="/config/renault/.venv/bin/renault-api"

        : "{{ account_id }}"
        : "{{ vin }}"

        LOG="/config/renault_cli.log"
        RAW="/config/renault/debug_status_refresh_raw.txt"

        {
            echo "=== $(date) status-refresh (http ping) ==="
            echo "HOME=$HOME XDG_CONFIG_HOME=$XDG_CONFIG_HOME XDG_DATA_HOME=$XDG_DATA_HOME"
            echo "REN_CLI=$REN_CLI"
            "${REN_CLI}" --version || true

            URL="/commerce/v1/accounts/{{ account_id }}/kamereon/kca/car-adapter/v2/cars/{{ vin }}/battery-status?country=GB&brand=RENAULT"
            echo "GET $URL"

            timeout 30s env HOME="$HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_DATA_HOME="$XDG_DATA_HOME" \
                "${REN_CLI}" --account "{{ account_id }}" http get "$URL" \
                > "$RAW" 2>&1 </dev/null || true

            tail -n 200 "$RAW"
            echo "=== done ==="
        } >> "$LOG" 2>&1
        '

    r5_diag: |-
        /bin/bash -lc '
        export HOME="/config/renault"
        export XDG_CONFIG_HOME="/config/renault"
        export XDG_DATA_HOME="/config/renault"

        if [ -f "/config/renault/.venv/bin/activate" ]; then
            . "/config/renault/.venv/bin/activate"
        fi

        REN_CLI="/config/renault/.venv/bin/renault-api"

        {
            echo "=== diag $(date) ==="
            echo "HOME=$HOME XDG_CONFIG_HOME=$XDG_CONFIG_HOME XDG_DATA_HOME=$XDG_DATA_HOME"
            echo "REN_CLI=$REN_CLI"
            env | sort
            command -v "${REN_CLI}" || true
            "${REN_CLI}" --version || true
            echo "=== end diag ==="
        } >> /config/renault_cli.log 2>&1
        '

    r5_api_login: /config/scripts/r5_api_login.sh

