
### Shell Commands ###

    r5_hornlights: |-
        /bin/bash -lc '
        set -euo pipefail

        export HOME="/config/renault"
        export XDG_CONFIG_HOME="/config/renault"
        export XDG_DATA_HOME="/config/renault"

        if [ -f "/config/renault/.venv/bin/activate" ]; then
            . "/config/renault/.venv/bin/activate"
        fi

        REN_CLI="/config/renault/.venv/bin/renault-api"

        LOG="/config/renault_cli.log"
        RAW="/config/renault/debug_hornlights_raw.txt"
        STATUS="/config/renault/hornlights_status.txt"

        {
            echo "=== $(date) horn-lights ==="
            echo "HOME=$HOME XDG_CONFIG_HOME=$XDG_CONFIG_HOME XDG_DATA_HOME=$XDG_DATA_HOME"
            echo "REN_CLI=$REN_CLI"
            "${REN_CLI}" --version || true

            # Preflight (VIN-specific): refresh token without interactive prompts
            PING_URL="/commerce/v1/accounts/{{ account_id }}/kamereon/kca/car-adapter/v2/cars/{{ vin }}/battery-status?country=GB&brand=RENAULT"
            echo "PING $PING_URL"

            timeout 25s env HOME="$HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_DATA_HOME="$XDG_DATA_HOME" \
                "${REN_CLI}" --account "{{ account_id }}" http get "$PING_URL" \
                > "$RAW" 2>&1 </dev/null || true

            if grep -qiE "please select|select vehicle|interactive_input_required|cli_requested_interactive_input|user:|password:|aborted|could not parse|invalid json" "$RAW"; then
                echo "PRECHECK FAILED: renault-api tried to prompt (non-interactive)."
                echo "PROMPTED_LOCALE_OR_LOGIN" > "$STATUS"
                tail -n 200 "$RAW"
                echo "=== done (prompted) ==="
                exit 0
            fi

            # Send command (non-interactive + bounded)
            CMD_URL="/commerce/v1/accounts/{{ account_id }}/kamereon/kca/car-adapter/v1/cars/{{ vin }}/actions/horn-lights?country=GB"
            echo "POST $CMD_URL target={{ target }}"

            timeout 25s env HOME="$HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_DATA_HOME="$XDG_DATA_HOME" \
                "${REN_CLI}" --account "{{ account_id }}" http post \
                "$CMD_URL" \
                "{\"data\":{\"type\":\"HornLights\",\"attributes\":{\"action\":\"start\",\"target\":\"{{ target }}\"}}}" \
                >> "$RAW" 2>&1 </dev/null || true

            if grep -qiE "please select|select vehicle|interactive_input_required|cli_requested_interactive_input|user:|password:|aborted|could not parse|invalid json" "$RAW"; then
                echo "POST FAILED: renault-api prompted (non-interactive)."
                echo "PROMPTED_LOCALE_OR_LOGIN" > "$STATUS"
                tail -n 200 "$RAW"
                echo "=== done (prompted) ==="
                exit 0
            fi

            echo "SENT" > "$STATUS"
            echo "--- horn-lights output ---"
            tail -n 200 "$RAW"
            echo "=== done ==="
        } >> "$LOG" 2>&1
        '

