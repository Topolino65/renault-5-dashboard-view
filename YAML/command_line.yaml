- sensor:
    name: "R5 Battery RAW"
    unique_id: r5_battery_raw
    command: "/bin/bash /config/scripts/get_r5_battery.sh"
    command_timeout: 90
    scan_interval: 300
    value_template: "{{ value_json.data.fetched_at }}"
    json_attributes:
      - data

- sensor:
    name: "R5 Status Raw"
    unique_id: r5_status_raw
    command: "/bin/bash /config/scripts/get_r5_battery.sh"
    command_timeout: 90
    scan_interval: 300
    value_template: >-
      {% set a = value_json.get('data', {}).get('attributes', {}) %}
      {{ a.get('timestamp', value_json.get('data', {}).get('fetched_at', now().isoformat())) }}
    json_attributes:
      - data

