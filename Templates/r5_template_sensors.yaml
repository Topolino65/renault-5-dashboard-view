        {% set root = root if root is mapping else {} %}
        {% set charges = root.get('attributes', {}).get('charges', []) %}
        {% set charges = charges if charges is iterable else [] %}
        {% if not charges %}
          0
        {% else %}
          {% set last = charges | max(attribute='chargeEndDate') %}
          {% set v = last.get('chargeEnergyRecovered') if last is mapping else none %}
          {{ (v | float(0)) | round(1) }}
