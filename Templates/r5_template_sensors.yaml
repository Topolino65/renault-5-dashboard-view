      unique_id: r5_last_charge_energy_stored_display
      icon: mdi:lightning-bolt
      state: >-
        {% if is_state('input_boolean.r5_charge_session_active','on') %}
          Wait...
        {% else %}
          {{ states('sensor.r5_last_charge_energy_stored_api') | float(0) | round(1) }} kWh
        {% endif %}

    ### (13) ###
    
    # Last Charge Type (Input Helper Value)
    - name: "R5 Charge Type (TMP)"
      unique_id: r5_charge_type_tmp
      icon: >-
        {% set s = states('sensor.r5_charge_type_tmp') | string | lower | trim %}
        {% if s in ['not rated'] %}
          mdi:alert
        {% else %}
          mdi:ev-station
        {% endif %}
      state: >-
        {% if is_state('input_boolean.r5_charge_session_active','on') %}
          Wait...
        {% else %}
          {% set t = states('input_text.r5_last_charge_type') %}
          {% if t not in ['','unknown','unavailable','none', None, 'n/a'] %}
            {{ t }}
          {% else %}
            {% set test_mode = is_state('input_boolean.r5_test_mode', 'on') %}
            {% set stored_avg = states('input_number.r5_last_charge_average_power_kw') | float(-1) %}
            {% set mins = states('input_number.r5_last_charge_duration_min') | float(0) %}
            {% set dE   = states('input_number.r5_charge_recovered_energy_kwh') | float(0) %}

            {% set avg_calc = ((dE / (mins/60)) if mins > 0 else 0) %}
            {% set avg_for_type = (avg_calc if test_mode else (stored_avg if stored_avg >= 0 else avg_calc)) %}

            {% if avg_for_type >= 80 %} Rapid DC
            {% elif avg_for_type >= 40 %} Fast DC
            {% elif avg_for_type >= 11 %} Fast AC
            {% elif avg_for_type > 0 %} Slow AC
            {% else %} Not Rated {% endif %}
          {% endif %}
        {% endif %}
      attributes:
        stored_type: "{{ states('input_text.r5_last_charge_type') }}"
        avg_power_used_kw: >-
          {% set test_mode = is_state('input_boolean.r5_test_mode', 'on') %}
          {% set stored_avg = states('input_number.r5_last_charge_average_power_kw') | float(-1) %}
          {% set mins = states('input_number.r5_last_charge_duration_min') | float(0) %}
          {% set dE   = states('input_number.r5_charge_recovered_energy_kwh') | float(0) %}
          {% set avg_calc = ((dE / (mins/60)) if mins > 0 else 0) %}
          {% set avg_for_type = (avg_calc if test_mode else (stored_avg if stored_avg >= 0 else avg_calc)) %}
          {{ avg_for_type | round(1) }}

    ### (14) ###

    # Last Charge End Status (Charges Raw Cached API Data)
    - name: "R5 Charge End Status (TMP)"
      unique_id: r5_charge_end_status_tmp
      icon: mdi:check-decagram
      state: >-
        {% if is_state('input_boolean.r5_charge_session_active','on') %}
          Wait...
        {% else %}
          {# 1) Charging now? #}
          {% set charger_state = states('sensor.r5_charger_status_api') | string | trim %}
          {% set rem = states('sensor.r5_charging_remaining_time_api') | int(0) %}
          {% set charging_now = (charger_state == 'In Progress') or (rem > 10) %}

          {# 2) Charges RAW is already the inner object (type/id/attributes/...) #}
          {% set root = state_attr('sensor.r5_charges_raw','data') %}
          {% set root = root if root is mapping else {} %}
          {% set attrs = root.get('attributes', {}) %}
          {% set attrs = attrs if attrs is mapping else {} %}
          {% set charges = attrs.get('charges', []) %}
          {% set charges = charges if charges is not none else [] %}

          {# 3) Find the most recent chargeEndStatus in the list #}
          {% set end = namespace(val='') %}
          {% for c in charges %}
            {% if c is mapping %}
              {% set v = c.get('chargeEndStatus') %}
              {% if v is not none %}
                {% set v = v | string | trim %}
                {% if v != '' %}
                  {% set end.val = v %}
                  {% break %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}

          {# 4) Output #}
          {% if charging_now %}
            In Progress
          {% else %}
            {% set sl = end.val | lower %}
            {% if sl == 'ok' %}
              Completed
            {% elif sl in ['ko','fail','failed','error'] %}
              Failed
            {% elif end.val != '' %}
              {{ end.val }}
            {% else %}
              N/A
            {% endif %}
          {% endif %}
        {% endif %}

    ### (15) ###

    # Last Charge Date (Charges Raw Cached API Data)
    - name: "R5 Last Charge Date (API)"
      unique_id: r5_last_charge_date_api
      icon: mdi:calendar
      state: >-
        {% if is_state('input_boolean.r5_charge_session_active','on') %}
          Wait...
        {% else %}
          {% set root = state_attr('sensor.r5_charges_raw', 'data') %}
          {% set root = root if root is mapping else {} %}
          {% set charges = root.get('attributes', {}).get('charges', []) %}
          {% set charges = charges if charges is iterable else [] %}
          {% if not charges %}
            unknown
          {% else %}
            {% set last = charges | max(attribute='chargeEndDate') %}
            {% set ts = last.get('chargeStartDate') if last is mapping else none %}
            {% if ts in [none,'','unknown','unavailable'] %}
              unknown
            {% else %}
              {% set dt = (ts | as_datetime | as_local) %}
              {{ dt.strftime('%d/%m/%y') }}
            {% endif %}
          {% endif %}
        {% endif %}

