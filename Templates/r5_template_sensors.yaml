##### Renault 5 Sensors #####

- sensor:

    # ======================
    # Vehicle Status Section
    # ======================

    ### (01) ###

    # Battery Level (Battery Raw Cached API Data)
    - name: "R5 Battery Level (API)"
      unique_id: r5_battery_level_api
      device_class: battery
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:car-battery
      state: >-
        {% set root = state_attr('sensor.r5_battery_raw', 'data') %}
        {% set root = root if root is mapping else {} %}
        {% set attrs = root.get('attributes', {}) %}
        {% set attrs = attrs if attrs is mapping else {} %}
        {% set v = attrs.get('batteryLevel') %}
        {{ (v | int(0)) if v not in [none, 'unknown', 'unavailable', ''] else 0 }}

    ### (02) ###

    # Available Energy 52kWh (Battery Raw Cached API Data)
    - name: "R5 Available Energy 52 kWh (API)"
      unique_id: r5_available_energy_52_api
      unit_of_measurement: "kWh"
      state_class: measurement
      icon: mdi:flash
      state: >-
        {% set capacity_kwh = 52 %}
        {% set data = state_attr('sensor.r5_battery_raw', 'data') or {} %}
        {% set attrs = data.get('attributes', {}) %}
        {% set soc = attrs.get('batteryLevel') %}
        {% if soc in [none, 'unknown', 'unavailable', ''] %}
          0
        {% else %}
          {{ (capacity_kwh * (soc | float(0)) / 100) | round(1) }}
        {% endif %}

    ### (03) ###

    # Estimated Range (Battery Raw Cached API Data)
    - name: "R5 Battery Autonomy MI (API)"
      unique_id: r5_battery_autonomy_api_mi
      unit_of_measurement: "miles"
      state_class: measurement
      icon: mdi:gauge
      state: >-
        {% set data = state_attr('sensor.r5_battery_raw', 'data') or {} %}
        {% set attrs = data.get('attributes', {}) %}
        {% set v = attrs.get('batteryAutonomy') %}
        {% if v in [none, 'unknown', 'unavailable', ''] %}
          0
        {% else %}
          {# convert km -> miles, no decimals #}
          {% set km = v | float(0) %}
          {{ (km * 0.621371) | round(0) | int }}
        {% endif %}

    ### (04) ###

    # Vehicle Mileage MI (Cockpit Raw Cached API Data)
    - name: "R5 Vehicle Mileage MI (API)"
      unique_id: r5_vehicle_mileage_mi_api
      unit_of_measurement: "miles"
      icon: mdi:counter
      state: >-
        {% set root = state_attr('sensor.r5_cockpit_raw', 'data') or {} %}
        {% set attrs = root.get('attributes', {}) %}
        {% set m = attrs.get('totalMileage') %}
        {% set km = m | float(0) %}
        {{ (km * 0.621371) | round(0) | int }}

    ### (05) ###
    
    # Charger Plug Status (Battery Raw Cached API Data)
    - name: "R5 Charger Plug Status (API)"
      unique_id: r5_charger_plug_status_api
      icon: >-
        {% if is_state('input_boolean.r5_test_mode','on') %}
          mdi:flask-outline
        {% else %}
          mdi:ev-plug-type2
        {% endif %}
      state: >-
          {% set test_mode = is_state('input_boolean.r5_test_mode', 'on') %}
          {% if test_mode %}
              Test (Connected)
          {% else %}
              {% set cli_prompted = is_state('binary_sensor.r5_renault_api_cli_prompted', 'on') %}
              {% set auth_fail = is_state('binary_sensor.r5_renault_api_auth_failure', 'on') %}
              {% set stale = is_state('binary_sensor.r5_renault_raw_stale', 'on') %}

              {% set bd = state_attr('sensor.r5_battery_raw', 'data') %}
              {% set bd = bd if bd is mapping else {} %}
              {% set ok = bd.get('ok', false) %}
              {% set err = (bd.get('error') | string | lower | trim) %}
              {% set ba = bd.get('attributes') if bd.get('attributes') is mapping else {} %}
              {% set plug = (ba.get('plugStatus', none) | string | trim) %}

              {# CLI prompted / cache mode => do not assert any plug state #}
              {% if cli_prompted or (not ok) or (err == 'cli_prompted') %}
                  Unknown (CLI)
              {% else %}
                  {# ---- Driving evidence for "Connected but actually unplugged" stuck detection ---- #}
                  {% set soc_now = ba.get('batteryLevel') %}
                  {% set soc_now = soc_now if soc_now is number else none %}

                  {% set cd = state_attr('sensor.r5_cockpit_raw', 'data') %}
                  {% set cd = cd if cd is mapping else {} %}
                  {% set ca = cd.get('attributes') if cd.get('attributes') is mapping else {} %}
                  {% set km_now = ca.get('totalMileage') %}
                  {% set km_now = km_now if km_now is number else none %}

                  {% set km_base = states('input_number.r5_plug_baseline_mileage_km') | float(0) %}
                  {% set soc_base = states('input_number.r5_plug_baseline_soc') | float(0) %}
                  {% set base_ts = states('input_datetime.r5_plug_baseline_ts') %}
                  {% set base_tsv = as_timestamp(base_ts, default=0) %}
                  {% set base_age = (now().timestamp() - base_tsv) | int(0) %}

                  {% set KM_DELTA = 1 %}
                  {% set SOC_DROP = 2 %}
                  {% set MIN_AGE  = 600 %}

                  {# Baseline expiry: prevents old baselines causing (D) for hours/days #}
                  {% set MAX_AGE  = 12 * 3600 %}

                  {% set drove =
                      (km_now is not none) and (soc_now is not none) and (base_tsv > 0) and
                      (base_age >= MIN_AGE) and
                      (base_age <= MAX_AGE) and
                      ((km_now - km_base) >= KM_DELTA) and
                      ((soc_base - soc_now) >= SOC_DROP)
                  %}

                  {# ---- Charging evidence for "Disconnected but actually plugged" stuck detection ---- #}
                  {% set ch_state = states('sensor.r5_charger_status_api') | string | trim %}

                  {# Keep evidence strict to avoid small/stuck remaining time values driving decisions #}
                  {% set charging_evidence = (ch_state == 'In Progress') %}

                  {# Base API meaning #}
                  {% set map = {'0':'Disconnected','1':'Connected','-1':'Plug Error','-2147483648':'Unknown'} %}
                  {% set base = map.get(plug, 'Unknown (' ~ plug ~ ')') %}

                  {# Stuck rules:
                     1) API says Connected but drove evidence suggests unplugged.
                     2) API says Disconnected but charging evidence suggests plugged.
                   #}
                  {% set stuck_connected = (plug == '1' and drove) %}
                  {% set stuck_disconnected = (plug == '0' and charging_evidence) %}
                  {% set stuck = stuck_connected or stuck_disconnected %}

                  {% set suffix =
                      (' (A)' if auth_fail else '') ~
                      (' (S)' if stale else '') ~
                      (' (D)' if stuck else '')
                  %}

                  {{ base ~ suffix }}
              {% endif %}
          {% endif %}
      attributes:
          test_mode: "{{ is_state('input_boolean.r5_test_mode', 'on') }}"
          plug_status_code: >-
              {% if is_state('input_boolean.r5_test_mode', 'on') %}
                  test
              {% else %}
                  {% set bd = state_attr('sensor.r5_battery_raw', 'data') %}
                  {% set bd = bd if bd is mapping else {} %}
                  {% set ba = bd.get('attributes') if bd.get('attributes') is mapping else {} %}
                  {{ (ba.get('plugStatus', none) | string | trim) }}
              {% endif %}
          stuck_rule_triggered: >-
              {% if is_state('input_boolean.r5_test_mode', 'on') %}
                  none
              {% else %}
                  {% set cli_prompted = is_state('binary_sensor.r5_renault_api_cli_prompted', 'on') %}
                  {% if cli_prompted %}
                      none
                  {% else %}
                      {% set bd = state_attr('sensor.r5_battery_raw', 'data') %}
                      {% set bd = bd if bd is mapping else {} %}
                       {% set ba = bd.get('attributes') if bd.get('attributes') is mapping else {} %}
                      {% set plug = (ba.get('plugStatus', none) | string | trim) %}

                      {% set soc_now = ba.get('batteryLevel') %}
                      {% set soc_now = soc_now if soc_now is number else none %}

                      {% set cd = state_attr('sensor.r5_cockpit_raw', 'data') %}
                      {% set cd = cd if cd is mapping else {} %}
                      {% set ca = cd.get('attributes') if cd.get('attributes') is mapping else {} %}
                      {% set km_now = ca.get('totalMileage') %}
                      {% set km_now = km_now if km_now is number else none %}

                      {% set km_base = states('input_number.r5_plug_baseline_mileage_km') | float(0) %}
                      {% set soc_base = states('input_number.r5_plug_baseline_soc') | float(0) %}
                      {% set base_ts = states('input_datetime.r5_plug_baseline_ts') %}
                      {% set base_tsv = as_timestamp(base_ts, default=0) %}
                      {% set base_age = (now().timestamp() - base_tsv) | int(0) %}

                      {% set KM_DELTA = 1 %}
                      {% set SOC_DROP = 2 %}
                      {% set MIN_AGE  = 600 %}
                      {% set MAX_AGE  = 12 * 3600 %}

                      {% set drove =
                          (km_now is not none) and (soc_now is not none) and (base_tsv > 0) and
                          (base_age >= MIN_AGE) and
                          (base_age <= MAX_AGE) and
                          ((km_now - km_base) >= KM_DELTA) and
                          ((soc_base - soc_now) >= SOC_DROP)
                      %}

                      {% set ch_state = states('sensor.r5_charger_status_api') | string | trim %}
                      {% set charging_evidence = (ch_state == 'In Progress') %}

                      {% if plug == '1' and drove %}
                          connected_but_drove
                      {% elif plug == '0' and charging_evidence %}
                          disconnected_but_charging
                      {% else %}
                          none
                      {% endif %}
                  {% endif %}
              {% endif %}
          flag_auth_failure: "{{ is_state('binary_sensor.r5_renault_api_auth_failure', 'on') }}"
          flag_raw_stale: "{{ is_state('binary_sensor.r5_renault_raw_stale', 'on') }}"
          flag_cli_prompted: "{{ is_state('binary_sensor.r5_renault_api_cli_prompted', 'on') }}"
          raw_ok: >-
              {% set bd = state_attr('sensor.r5_battery_raw', 'data') %}
              {{ (bd.get('ok', false) if bd is mapping else false) }}
          raw_error: >-
              {% set bd = state_attr('sensor.r5_battery_raw', 'data') %}
              {{ (bd.get('error') if bd is mapping else none) }}
              
    ### (06) ### 
    
    # Charger Status (Battery Raw Cached API Data)
    - name: "R5 Charger Status (API)"
      unique_id: r5_charger_status_api
      icon: >-
        {% if is_state('input_boolean.r5_test_mode','on') %}
          mdi:flask-outline
        {% else %}
          mdi:ev-station
        {% endif %}
      state: >-
        {% set test_mode = is_state('input_boolean.r5_test_mode', 'on') %}
        {% if test_mode %}
          Test (In Progress)
        {% else %}
          {% set cli_prompted = is_state('binary_sensor.r5_renault_api_cli_prompted', 'on') %}
          {% set auth_fail = is_state('binary_sensor.r5_renault_api_auth_failure', 'on') %}
          {% set stale = is_state('binary_sensor.r5_renault_raw_stale', 'on') %}

          {% set bd = state_attr('sensor.r5_battery_raw', 'data') %}
          {% set bd = bd if bd is mapping else {} %}
          {% set ok = bd.get('ok', false) %}
          {% set err = (bd.get('error') | string | lower | trim) %}
          {% set a = bd.get('attributes') if bd.get('attributes') is mapping else {} %}

          {% if cli_prompted or (not ok) or (err == 'cli_prompted') %}
            Unknown (CLI)
          {% else %}
            {# RAW codes from API #}
            {% set code = (a.get('chargingStatus', none) | string | trim) %}
            {% set plug_code = (a.get('plugStatus', none) | string | trim) %}

            {# Remaining time from RAW + from sanitised sensor #}
            {% set raw_rem = a.get('chargingRemainingTime', 0) | int(0) %}
            {% set rem_state = states('sensor.r5_charging_remaining_time_api') %}
            {% set san_rem = rem_state | int(0) if rem_state not in ['unknown','unavailable','none',''] else 0 %}

            {# Your fast evidence sources (rate/power usually flip first) #}
            {% set rate = states('sensor.r5_charging_rate_display') | float(0) %}
            {% set hv_power = states('sensor.r5_hypervolt_ev_power') | float(0) %}
            {% set evidence = (rate > 0.1) or (hv_power > 0.2) %}

            {# Derived plug override marker (your plug sensor uses "... (D)") #}
            {% set plug_state = states('sensor.r5_charger_plug_status_api') | lower | trim %}
            {% set plug_stuck = plug_state.endswith('(d)') %}

            {# Base map #}
            {% set map = {
              '0.0': 'Not Charging',
              '0.1': 'On Hold',
              '0.2': 'Charge Ended',
              '0.3': 'On Hold',
              '0.4': 'Flap Open',
              '1.0': 'In Progress',
              '-1.0': 'Charge Error',
              '-1.1': 'Unavailable'
            } %}

            {% set base = map.get(code, 'Unknown (' ~ code ~ ')') %}

            {# Override #1: evidence says charging RIGHT NOW (covers API lag) #}
            {% set override_in_progress_evidence = (plug_code == '1') and evidence %}

            {# Override #2: credible remaining time also implies charging #}
            {% set override_in_progress_remaining = (plug_code == '1') and ((raw_rem > 10) or (san_rem > 10)) %}

            {% if override_in_progress_evidence or override_in_progress_remaining %}
              {% set base = 'In Progress' %}
            {% endif %}

            {# Suffixes #}
            {% set suffix =
              (' (A)' if auth_fail else '') ~
              (' (S)' if stale else '') ~
              (' (D)' if plug_stuck else '') ~
              (' (E)' if override_in_progress_evidence and (base == 'In Progress') and (code != '1.0') else '')
            %}

            {{ base ~ suffix }}
          {% endif %}
        {% endif %}
      attributes:
        test_mode: "{{ is_state('input_boolean.r5_test_mode', 'on') }}"
        charging_status_code: >-
          {% if is_state('input_boolean.r5_test_mode', 'on') %}
            test
          {% else %}
            {% set bd = state_attr('sensor.r5_battery_raw', 'data') %}
            {% set bd = bd if bd is mapping else {} %}
            {% set a = bd.get('attributes') if bd.get('attributes') is mapping else {} %}
            {{ (a.get('chargingStatus', none) | string | trim) }}
          {% endif %}
        plug_status_code: >-
          {% set bd = state_attr('sensor.r5_battery_raw', 'data') %}
          {% set bd = bd if bd is mapping else {} %}
          {% set a = bd.get('attributes') if bd.get('attributes') is mapping else {} %}
          {{ (a.get('plugStatus', none) | string | trim) }}
        remaining_time_raw: >-
          {% set bd = state_attr('sensor.r5_battery_raw', 'data') %}
          {% set bd = bd if bd is mapping else {} %}
          {% set a = bd.get('attributes') if bd.get('attributes') is mapping else {} %}
          {{ a.get('chargingRemainingTime', 0) | int(0) }}
        remaining_time_sanitised: "{{ states('sensor.r5_charging_remaining_time_api') }}"
        evidence_rate_kw: "{{ states('sensor.r5_charging_rate_display') }}"
        evidence_hypervolt_power_kw: "{{ states('sensor.r5_hypervolt_ev_power') }}"
        evidence_active: >-
          {% set rate = states('sensor.r5_charging_rate_display') | float(0) %}
          {% set hv_power = states('sensor.r5_hypervolt_ev_power') | float(0) %}
          {{ (rate > 0.1) or (hv_power > 0.2) }}
        plug_state_interpreted: "{{ states('sensor.r5_charger_plug_status_api') }}"
        flag_auth_failure: "{{ is_state('binary_sensor.r5_renault_api_auth_failure', 'on') }}"
        flag_raw_stale: "{{ is_state('binary_sensor.r5_renault_raw_stale', 'on') }}"
        flag_cli_prompted: "{{ is_state('binary_sensor.r5_renault_api_cli_prompted', 'on') }}"
        raw_ok: >-
          {% set bd = state_attr('sensor.r5_battery_raw', 'data') %}
          {{ (bd.get('ok', false) if bd is mapping else false) }}
        raw_error: >-
          {% set bd = state_attr('sensor.r5_battery_raw', 'data') %}
          {{ (bd.get('error') if bd is mapping else none) }}
          
    ### (07) ###
    
    # Charging Rate (Numeric)
    - name: "R5 Charging Rate (kW)"
      unique_id: r5_charging_rate_kw
      icon: >-
        {% if is_state('input_boolean.r5_test_mode','on') %}
          mdi:flask-outline
        {% else %}
          mdi:flash
        {% endif %}
      unit_of_measurement: "kW"
      state_class: measurement
      state: >-
        {% set hv = states('<ev-charger-power>') %}
        {% set hv_kw = (hv | float(0)) if hv not in ['unknown','unavailable','none',''] else 0 %}

        {% set active = is_state('input_boolean.r5_charge_session_active', 'on') %}
        {% set hv_cnt = states('input_number.r5_hv_avg_count') | int(0) %}
        {% set public_session = active and (hv_cnt == 0) %}

        {# charging evidence: remaining time OR charger says in progress #}
        {% set rem = states('sensor.r5_charging_remaining_time_api') | int(0) %}
        {% set st = states('sensor.r5_charger_status_api') | string | trim %}
        {% set charging_evidence = (st == 'In Progress') or (rem > 10) %}

        {# public estimate using elapsed minutes #}
        {% set start_kwh = states('sensor.r5_last_charge_start_energy_tmp') | float(-1) %}
        {% set now_kwh = states('sensor.r5_available_energy_52_kwh_api') | float(-1) %}

        {% set s = states('input_datetime.r5_last_charge_start') %}
        {% set st_ts = as_timestamp(s, 0) %}
        {% set mins = ((as_timestamp(now()) - st_ts) / 60) if st_ts > 0 else 0 %}

        {% set est_kw = 0 %}
        {% if start_kwh >= 0 and now_kwh >= 0 and mins > 1 and now_kwh > start_kwh %}
          {% set dE = now_kwh - start_kwh %}
          {% set est_kw = (dE / (mins/60)) %}
        {% endif %}

        {% if hv_kw > 0.2 %}
          {{ hv_kw | round(1) }}
        {% elif public_session and charging_evidence and est_kw > 0.2 %}
          {{ est_kw | round(1) }}
        {% else %}
          0
        {% endif %}
      attributes:
        source: >-
          {% set hv = states('ev-charger-power>') %}
          {% set hv_kw = (hv | float(0)) if hv not in ['unknown','unavailable','none',''] else 0 %}
          {% set active = is_state('input_boolean.r5_charge_session_active', 'on') %}
          {% set hv_cnt = states('input_number.r5_hv_avg_count') | int(0) %}
          {% set public_session = active and (hv_cnt == 0) %}
          {{ 'home-charger' if hv_kw > 0.2 else ('public_estimate' if public_session else ('hv_idle' if active else 'idle')) }}

    # Charging Rate (Display)
    - name: "R5 Charging Rate (Display)"
      unique_id: r5_charging_rate_display
      icon: >-
        {% if is_state('input_boolean.r5_test_mode','on') %}
          mdi:flask-outline
        {% else %}
          mdi:flash
        {% endif %}
      state: >-
        {% if is_state('input_boolean.r5_test_mode','on') %}
          {% set p = states('input_number.test_last_charge_start_power_kw') | float(7.2) %}
          Test ({{ p | round(1) }} kW)
        {% else %}
          {% set active = is_state('input_boolean.r5_charge_session_active', 'on') %}
          {% set hv_cnt = states('input_number.r5_hv_avg_count') | int(0) %}
          {% set public_session = active and (hv_cnt == 0) %}

          {# charging evidence: remaining time OR charger says in progress #}
          {% set rem = states('sensor.r5_charging_remaining_time_api') | int(0) %}
          {% set st = states('sensor.r5_charger_status_api') | string | trim %}
          {% set charging_evidence = (st == 'In Progress') or (rem > 10) %}

          {% set v = states('sensor.r5_charging_rate_kw') %}
          {% set kw = (v | float(0)) if v not in ['unknown','unavailable','none',''] else 0 %}

          {% if public_session and charging_evidence and kw <= 0 %}
            Public
          {% elif kw > 0 %}
            {{ kw | round(1) }} kW
          {% else %}
            0 kW
          {% endif %}
        {% endif %}
      attributes:
        numeric_kw_entity: sensor.r5_charging_rate_kw

    ### (08) ###

    # Charging Remaining Time (Battery Raw Cached API Data)
    - name: "R5 Charging Remaining Time (API)"
      unique_id: r5_charging_remaining_time_api
      icon: mdi:timer
      unit_of_measurement: min
      state_class: measurement
      state: >-
        {% set d = state_attr('sensor.r5_battery_raw', 'data') %}
        {% set d = d if d is mapping else {} %}
        {% set a = d.get('attributes') %}
        {% set a = a if a is mapping else {} %}

        {% set cur = a.get('chargingRemainingTime', 0) | int(0) %}
        {% set cs  = (a.get('chargingStatus', none) | string | trim) %}
        {% set st  = states('sensor.r5_charger_status_api') | string | trim %}

        {# Consider "actively charging" if battery says charging OR charger status says In Progress #}
        {% set charging_now = (cs == '1.0') or (st == 'In Progress') %}

        {% if not charging_now %}
          0
        {% else %}
          {{ 0 if cur <= 5 else cur }}
        {% endif %}
      attributes:
        raw_minutes: >-
          {% set d = state_attr('sensor.r5_battery_raw', 'data') %}
          {% set d = d if d is mapping else {} %}
          {% set a = d.get('attributes') %}
          {% set a = a if a is mapping else {} %}
          {{ a.get('chargingRemainingTime', 0) | int(0) }}
        charging_status_code: >-
          {% set d = state_attr('sensor.r5_battery_raw', 'data') %}
          {% set d = d if d is mapping else {} %}
          {% set a = d.get('attributes') %}
          {% set a = a if a is mapping else {} %}
          {{ (a.get('chargingStatus', none) | string | trim) }}
        charger_status_used: "{{ states('sensor.r5_charger_status_api') }}"
              
    # Charging Remaining Time Display (Battery Raw Cached API Data)              
    - name: "R5 Charging Remaining Time (Display)"
      unique_id: r5_charging_remaining_time_display
      icon: >-
        {% if is_state('input_boolean.r5_test_mode','on') %}
          mdi:flask-outline
        {% else %}
          mdi:timer
        {% endif %}
      state: >-
        {% if is_state('input_boolean.r5_test_mode','on') %}
          Test (5 min)
        {% else %}
          {% set minutes = states('sensor.r5_charging_remaining_time_api') | int(0) %}
          {% set hrs = (minutes // 60) | int %}
          {% set mins = (minutes % 60) | int %}
          {% set hr_label = 'hr' if hrs == 1 else 'hrs' %}
          {% set min_label = 'min' if mins == 1 else 'mins' %}

          {% if minutes <= 0 %}
            Not Charging
          {% elif minutes < 60 %}
            {{ mins }} {{ min_label }}
          {% elif mins == 0 %}
            {{ hrs }} {{ hr_label }}
          {% else %}
            {{ hrs }} {{ hr_label }} {{ mins }} {{ min_label }}
          {% endif %}
        {% endif %}
              
    ### (09) ###
    
    # Charging Flap Status (Derived From Plug & Charger Status)
    - name: "R5 Charging Flap Status (API)"
      unique_id: r5_charging_flap_status_api
      icon: >-
          {% set test_mode = is_state('input_boolean.r5_test_mode', 'on') %}
          {% if test_mode %}
              mdi:flask-outline
          {% else %}
              {% set cli_prompted = is_state('binary_sensor.r5_renault_api_cli_prompted', 'on') %}
              {% set auth_fail = is_state('binary_sensor.r5_renault_api_auth_failure', 'on') %}
              {% set stale = is_state('binary_sensor.r5_renault_raw_stale', 'on') %}

              {% set plug_state = states('sensor.r5_charger_plug_status_api') | lower | trim %}
              {% set is_stuck = plug_state.endswith('(d)') %}
              {% set is_connected = plug_state.startswith('connected') %}

              {% set cs_code = (state_attr('sensor.r5_charger_status_api', 'charging_status_code') | string | trim) %}

              {% if cli_prompted %}
                  mdi:help-circle-outline
              {% elif is_stuck %}
                  mdi:help-circle-outline
              {% elif is_connected or cs_code == '0.4' %}
                  mdi:lock-open
              {% else %}
                  mdi:lock-check
              {% endif %}
          {% endif %}
      state: >-
          {% set test_mode = is_state('input_boolean.r5_test_mode', 'on') %}
          {% if test_mode %}
              Test (Open)
          {% else %}
