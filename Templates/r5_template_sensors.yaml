        {% else %}
          {% set start = states('sensor.r5_last_charge_start_energy_tmp') | float(-1) %}
          {% set end   = states('sensor.r5_last_charge_end_energy_tmp') | float(-1) %}
          {% if start < 0 or end < 0 %}
            0
          {% else %}
            {% set delta = end - start %}
            {{ (0 if delta < 0 else delta) | round(1) }}
          {% endif %}
        {% endif %}
      attributes:
        start_kwh_used: "{{ states('sensor.r5_last_charge_start_energy_tmp') }}"
        end_kwh_used: "{{ states('sensor.r5_last_charge_end_energy_tmp') }}"
        stored_delta_kwh: "{{ states('input_number.r5_charge_recovered_energy_kwh') }}"
        
