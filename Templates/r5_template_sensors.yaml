        {% set root = state_attr('sensor.r5_charges_raw', 'data') %}
        {% set root = root if root is mapping else {} %}
        {% set charges = root.get('attributes', {}).get('charges', []) %}
        {% set charges = charges if charges is iterable else [] %}

        {% set best = namespace(ts=0, item={}) %}
        {% for c in charges %}
          {% if c is mapping %}
            {% set ed = c.get('chargeEndDate') %}
            {% set ts = as_timestamp(ed, 0) if ed not in [none,''] else 0 %}
            {% if ts > best.ts %}
              {% set best.ts = ts %}
              {% set best.item = c %}
            {% endif %}
          {% endif %}
