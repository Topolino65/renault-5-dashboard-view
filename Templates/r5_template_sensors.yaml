    - name: test_charge_type
      unique_id: test_charge_type
      icon: >-
        {% if is_state('input_boolean.r5_test_mode','on') %}
          mdi:flask-outline
        {% else %}
          mdi:ev-station
        {% endif %}
      state: >-
        {% if is_state('input_boolean.r5_test_mode','on') %}
          Wait...
        {% else %}
          {% set s_ts = as_timestamp(states('input_datetime.test_last_charge_start'), 0) %}
          {% set e_ts = as_timestamp(states('input_datetime.test_last_charge_end'), 0) %}
          {% set mins = ((e_ts - s_ts) / 60) if (s_ts > 0 and e_ts > 0 and e_ts >= s_ts) else 0 %}
          {% set start_e = states('input_number.test_charge_start_energy_kwh') | float(0) %}
          {% set end_e   = states('input_number.test_charge_end_energy_kwh') | float(0) %}
          {% set dE = (end_e - start_e) %}
          {% set avg_calc = (dE / (mins/60)) if mins > 0 else 0 %}
          {% if avg_calc >= 80 %} Rapid DC
          {% elif avg_calc >= 40 %} Fast DC
          {% elif avg_calc >= 11 %} Fast AC
          {% elif avg_calc > 0 %} Slow AC
          {% else %} Not Rated {% endif %}
        {% endif %}

