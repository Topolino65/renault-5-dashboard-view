    #### (11) ###

    # Last Charge Average Power (Input Helper Value)
    - name: "R5 Charge Average Power (TMP)"
      unique_id: r5_charge_average_power_tmp
      unit_of_measurement: "kW"
      state_class: measurement
      icon: mdi:flash
      state: >-
        {% set active = is_state('input_boolean.r5_charge_session_active', 'on') %}
        {% set stored_avg = states('input_number.r5_last_charge_average_power_kw') | float(0) %}

        {% if not active %}
          {{ stored_avg | round(1) }}
        {% else %}
          {% set acc = states('input_number.r5_hv_avg_accum_kw') | float(0) %}
          {% set cnt = states('input_number.r5_hv_avg_count') | float(0) %}

          {# Home (Hypervolt) path #}
          {% if cnt > 0 %}
            {{ (acc / cnt) | round(1) }}
          {% else %}
            {# Public fallback: estimate avg kW = (energy gained so far) / (hours elapsed) #}
            {% set start_kwh = states('sensor.r5_last_charge_start_energy_tmp') | float(-1) %}
            {% set now_kwh = states('sensor.r5_available_energy_52_kwh_api') | float(-1) %}
            
            {% set s = states('input_datetime.r5_last_charge_start') %}
            {% set st = as_timestamp(s, 0) %}
            {% set mins = ((as_timestamp(now()) - st) / 60) if st > 0 else 0 %}

            {% if start_kwh >= 0 and now_kwh >= 0 and mins > 1 and now_kwh > start_kwh %}
              {% set dE = now_kwh - start_kwh %}
              {{ (dE / (mins/60)) | round(1) }}
            {% else %}
              0
            {% endif %}
          {% endif %}
        {% endif %}
      attributes:
        session_active: "{{ is_state('input_boolean.r5_charge_session_active','on') }}"
        stored_avg_kw: "{{ states('input_number.r5_last_charge_average_power_kw') }}"
        acc_kw_sum: "{{ states('input_number.r5_hv_avg_accum_kw') }}"
        sample_count: "{{ states('input_number.r5_hv_avg_count') }}"
        public_fallback_avg_kw: >-
          {% set start_kwh = states('sensor.r5_last_charge_start_energy_tmp') | float(-1) %}
          {% set now_kwh = states('sensor.r5_available_energy_52_kwh_api') | float(-1) %}

          {% set s = states('input_datetime.r5_last_charge_start') %}
          {% set st = as_timestamp(s, 0) %}
          {% set mins = ((as_timestamp(now()) - st) / 60) if st > 0 else 0 %}

          {% if start_kwh >= 0 and now_kwh >= 0 and mins > 1 and now_kwh > start_kwh %}
            {{ ((now_kwh - start_kwh) / (mins/60)) | round(1) }}
          {% else %}
            0
          {% endif %}

    # Last Charge Average Power (Display)
    - name: "R5 Charge Average Power (Display)"
      unique_id: r5_charge_average_power_display
      icon: mdi:flash
      state: >-
        {% set active = is_state('input_boolean.r5_charge_session_active', 'on') %}
        {% set cnt = states('input_number.r5_hv_avg_count') | int(0) %}

        {% set v = states('sensor.r5_charge_average_power_tmp') %}
        {% set kw = (v | float(0)) if v not in ['unknown','unavailable','none',''] else 0 %}

        {# show Public if it looks like a public session and no avg ever materialized #}
        {% set stored_avg = states('input_number.r5_last_charge_average_power_kw') | float(0) %}
        {% set public_like = (cnt == 0) %}

        {% if public_like and ((active and kw <= 0) or ((not active) and stored_avg <= 0)) %}
          Public
        {% else %}
          {{ kw | round(1) }} kW
        {% endif %}
      attributes:
        session_active: "{{ is_state('input_boolean.r5_charge_session_active','on') }}"
        public_session: >-
          {% set active = is_state('input_boolean.r5_charge_session_active', 'on') %}
          {% set cnt = states('input_number.r5_hv_avg_count') | int(0) %}
          {{ active and (cnt == 0) }}
        tmp_kw: "{{ states('sensor.r5_charge_average_power_tmp') }}"
        hv_sample_count: "{{ states('input_number.r5_hv_avg_count') }}"
        
    # Last Charge Average Power (Last-Charge Card Display)
