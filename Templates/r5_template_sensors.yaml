      attributes:
        title: >-
          {% if is_state('binary_sensor.r5_renault_api_auth_failure','on') %}
            Renault API – Auth Failure
          {% elif is_state('binary_sensor.r5_renault_api_cli_prompted','on') %}
            Renault API – CLI Prompted
          {% elif is_state('binary_sensor.r5_renault_raw_stale','on') %}
            Renault API – RAW Data Stale
          {% else %}
            Renault API – OK
          {% endif %}
        message: >-
          {% if is_state('binary_sensor.r5_renault_api_auth_failure','on') %}
          **What happened?**  
          Home Assistant could not authenticate to Renault (token/session issue).

          **What to do:**  
          • Let automation (8) run (re-login + refresh)  
          • Check `/config/renault/renault_api_login.log` and `/config/renault_cli.log`
          {% elif is_state('binary_sensor.r5_renault_api_cli_prompted','on') %}
          **What happened?**  
          `renault-api` tried to ask an interactive question (can’t in HA), so the call aborted and scripts fell back to cache.

          **What to do:**  
          • Let automation (8) run  
          • Check `/config/renault_cli.log` for “User: Aborted!” / “Please select account”
          {% elif is_state('binary_sensor.r5_renault_raw_stale','on') %}
          **What happened?**  
          One or more RAW sensors are stale (based on `fetched_at`).

          **What to do:**  
          • Let automation (8) run  
          • If it persists, check the logs and API reachability
          {% else %}
          Everything looks OK right now.
          {% endif %}

