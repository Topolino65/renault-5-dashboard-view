    # ==============================
    # Auth, CLI Prompt, Stale Alerts
    # ==============================

    - name: "R5 Renault API Auth Failure"
      unique_id: r5_renault_api_auth_failure
      icon: >-
        {{ 'mdi:account-alert' if is_state('binary_sensor.r5_renault_api_auth_failure','on')
           else 'mdi:account-check' }}
      state: >-
        {% set raws = [
          'sensor.r5_battery_raw',
          'sensor.r5_status_raw',
          'sensor.r5_charges_raw',
          'sensor.r5_soc_levels_raw',
          'sensor.r5_ev_settings_raw',
          'sensor.r5_hvac_raw',
          'sensor.r5_cockpit_raw',
          'sensor.r5_location_raw'
        ] %}
        {% set authish = ['unauthorized','invalid token','forbidden'] %}
        {% set ns = namespace(hit=false) %}
        {% for e in raws %}
          {% set d = state_attr(e,'data') %}
          {% set d = d if d is mapping else {} %}
          {% set err = (d.get('error') | default('', true) | string | lower | trim) %}
          {% set note = (d.get('note') | default('', true) | string | lower | trim) %}
          {% set blob = (err ~ ' ' ~ note) | trim %}
          {% if authish | select('in', blob) | list | length > 0 %}
            {% set ns.hit = true %}
          {% endif %}
        {% endfor %}
        {{ 'on' if ns.hit else 'off' }}
      attributes:
        offenders: >-
          {% set raws = [
            'sensor.r5_battery_raw',
            'sensor.r5_status_raw',
            'sensor.r5_charges_raw',
            'sensor.r5_soc_levels_raw',
            'sensor.r5_ev_settings_raw',
            'sensor.r5_hvac_raw',
            'sensor.r5_cockpit_raw',
            'sensor.r5_location_raw'
          ] %}
          {% set authish = ['unauthorized','invalid token','forbidden'] %}
          {% set out = namespace(list=[]) %}
          {% for e in raws %}
            {% set d = state_attr(e,'data') %}
            {% set d = d if d is mapping else {} %}
            {% set err = (d.get('error') | default('', true) | string | lower | trim) %}
            {% set note = (d.get('note') | default('', true) | string | lower | trim) %}
            {% set blob = (err ~ ' ' ~ note) | trim %}
            {% if authish | select('in', blob) | list | length > 0 %}
              {% set out.list = out.list + [ e ~ ' (err=' ~ err ~ ', note=' ~ note ~ ')' ] %}
            {% endif %}
          {% endfor %}
          {{ out.list }}

    - name: "R5 Renault API CLI Prompted"
      unique_id: r5_renault_api_cli_prompted
      icon: >-
        {{ 'mdi:console-network' if is_state('binary_sensor.r5_renault_api_cli_prompted','on')
           else 'mdi:console' }}
      state: >-
        {% set raws = [
          'sensor.r5_battery_raw',
          'sensor.r5_status_raw',
          'sensor.r5_charges_raw',
          'sensor.r5_soc_levels_raw',
          'sensor.r5_ev_settings_raw',
          'sensor.r5_hvac_raw',
          'sensor.r5_cockpit_raw',
          'sensor.r5_location_raw'
        ] %}
        {% set ns = namespace(hit=false) %}
        {% for e in raws %}
          {% set d = state_attr(e, 'data') %}
          {% set d = d if d is mapping else {} %}
          {% set err = (d.get('error') | default('', true) | string | lower | trim) %}
          {% set note = (d.get('note') | default('', true) | string | lower | trim) %}
          {% if err == 'cli_prompted'
                or err == 'cli_requested_interactive_input'
                or err == 'interactive_input_required'
                or err == 'stale_cache_used_cli_prompt'
                or 'cli_requested_interactive_input' in note
                or 'interactive_input_required' in note
                or 'stale_cache_used_cli_prompt' in note %}
            {% set ns.hit = true %}
          {% endif %}
        {% endfor %}
        {{ 'on' if ns.hit else 'off' }}
      attributes:
        offenders: >-
          {% set raws = [
            'sensor.r5_battery_raw',
            'sensor.r5_status_raw',
            'sensor.r5_charges_raw',
            'sensor.r5_soc_levels_raw',
            'sensor.r5_ev_settings_raw',
            'sensor.r5_hvac_raw',
            'sensor.r5_cockpit_raw',
            'sensor.r5_location_raw'
          ] %}
          {% set out = namespace(list=[]) %}
          {% for e in raws %}
            {% set d = state_attr(e, 'data') %}
            {% set d = d if d is mapping else {} %}
            {% set err = (d.get('error') | default('', true) | string | lower | trim) %}
            {% set note = (d.get('note') | default('', true) | string | lower | trim) %}
            {% if err == 'cli_prompted'
                  or err == 'cli_requested_interactive_input'
                  or err == 'interactive_input_required'
                  or err == 'stale_cache_used_cli_prompt'
                  or 'cli_requested_interactive_input' in note
                  or 'interactive_input_required' in note
                  or 'stale_cache_used_cli_prompt' in note %}
              {% set out.list = out.list + [ e ~ ' (err=' ~ err ~ ', note=' ~ note ~ ')' ] %}
            {% endif %}
          {% endfor %}
          {{ out.list }}

    - name: "R5 Renault RAW Stale"
      unique_id: r5_renault_raw_stale
      icon: >-
        {{ 'mdi:database-alert' if is_state('binary_sensor.r5_renault_raw_stale','on')
           else 'mdi:database-check' }}
      state: >-
        {% set raws = [
          'sensor.r5_battery_raw',
          'sensor.r5_status_raw',
          'sensor.r5_charges_raw',
          'sensor.r5_soc_levels_raw',
          'sensor.r5_hvac_raw',
          'sensor.r5_ev_settings_raw',
          'sensor.r5_cockpit_raw',
          'sensor.r5_location_raw'
        ] %}
        {% set limit = 6 * 3600 %}
        {% set ns = namespace(stale=false) %}
        {% for e in raws %}
          {% set d = state_attr(e, 'data') %}
          {% set d = d if d is mapping else {} %}
          {% set ts = d.get('fetched_at') %}
          {% set tsv = as_timestamp(ts, default=none) %}
          {% if tsv is none %}
            {% set ns.stale = true %}
          {% else %}
            {% set age = (now().timestamp() - tsv) | int %}
            {% if age > limit %}
              {% set ns.stale = true %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ 'on' if ns.stale else 'off' }}
      attributes:
        stale_over_hours: 6
        offenders: >-
          {% set raws = [
            'sensor.r5_battery_raw',
            'sensor.r5_status_raw',
            'sensor.r5_charges_raw',
            'sensor.r5_soc_levels_raw',
            'sensor.r5_hvac_raw',
            'sensor.r5_ev_settings_raw',
            'sensor.r5_cockpit_raw',
            'sensor.r5_location_raw'
          ] %}
          {% set limit = 6 * 3600 %}
          {% set out = namespace(list=[]) %}
          {% for e in raws %}
            {% set d = state_attr(e, 'data') %}
            {% set d = d if d is mapping else {} %}
            {% set ts = d.get('fetched_at') %}
            {% set tsv = as_timestamp(ts, default=none) %}
            {% if tsv is none %}
              {% set out.list = out.list + [e ~ ' (no fetched_at)'] %}
            {% else %}
              {% set age = (now().timestamp() - tsv) | int %}
              {% if age > limit %}
                {% set out.list = out.list + [e ~ ' (' ~ ((age/3600) | round(1)) ~ 'h)'] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ out.list }}
          
